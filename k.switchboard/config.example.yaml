# Konfigurationsbeispiel für K.Switchboard
# Kopieren nach:
#   Windows: %APPDATA%\K.Switchboard\config.yaml
#   Linux/macOS: ~/.config/k-switchboard/config.yaml

# ---------------------------------------------------------------------------
# Server-Port
# K.Switchboard lauscht auf diesem Port. Clients müssen ANTHROPIC_BASE_URL
# auf http://localhost:<port> setzen. Standard: 3456.
# ---------------------------------------------------------------------------
port: 3456

# ---------------------------------------------------------------------------
# Anthropic-Provider
# Basis-URL der Anthropic API. Nur ändern, wenn ein anderer Anthropic-
# kompatibler Endpunkt (z.B. Azure AI Gateway) genutzt werden soll.
# Der ANTHROPIC_API_KEY wird bitidentisch aus dem Client weitergeleitet.
# ---------------------------------------------------------------------------
anthropic_base_url: https://api.anthropic.com

# ---------------------------------------------------------------------------
# Ollama-Provider
# Basis-URL der lokalen Ollama-Instanz. Modelle mit ':' im Namen (z.B.
# llama3.2:3b) sowie konfigurierte Aliase werden automatisch hier geroutet.
# Voraussetzung: Ollama läuft lokal (ollama serve).
# ---------------------------------------------------------------------------
ollama_base_url: http://localhost:11434

# ---------------------------------------------------------------------------
# Modell-Aliase
# Bilden einen Kurznamen auf einen echten Provider-Modellnamen ab.
# Modelle mit ':' im Namen werden automatisch als Ollama-Modelle erkannt,
# auch ohne Alias-Eintrag. Aliase sind case-sensitiv.
# ---------------------------------------------------------------------------
model_aliases:
  local-coder: codellama:13b
  local-fast: llama3.2:3b

# ---------------------------------------------------------------------------
# Fallback-Ketten
# Wenn ein Modell einen Fehler zurückgibt (Netzwerkfehler oder HTTP 4xx/5xx),
# versucht K.Switchboard das unter 'to' angegebene Modell. Ketten können
# mehrere Stufen haben. Der Client erhält den Header
# X-K-Switchboard-Fallback-Used: <from> -> <to>.
# ---------------------------------------------------------------------------
fallback_chains:
  - from: local-coder
    to: claude-sonnet-latest
  - from: local-fast
    to: claude-haiku-latest
  - from: claude-opus-latest
    to: claude-sonnet-latest
  - from: claude-sonnet-latest
    to: claude-haiku-latest

# Preise in USD per 1M Tokens (Stand Mai 2026)
pricing:
  claude-opus-latest:
    input: 15.0
    output: 75.0
  claude-sonnet-latest:
    input: 3.0
    output: 15.0
  claude-haiku-latest:
    input: 0.25
    output: 1.25
  local-coder:
    input: 0.0
    output: 0.0
  local-fast:
    input: 0.0
    output: 0.0
