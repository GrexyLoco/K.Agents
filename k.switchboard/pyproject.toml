[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k-switchboard"
version = "0.1.0"
description = "Transparenter HTTP-Proxy zwischen Claude Max und Ollama"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "respx>=0.21",
]
windows = [
    "pywin32>=308",
]

[project.scripts]
k-switchboard = "k_switchboard.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
