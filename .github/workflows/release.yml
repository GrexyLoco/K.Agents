name: 🚀 Release

# 🎯 Bei jedem Push auf master: Patch-Bump → Smartagr Release → JSON Update
on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/workflows/release.yml'

jobs:
  release:
    name: 🚀 Smart Release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔢 Version bumpen
        id: version
        shell: pwsh
        run: |
          $pluginPath = Join-Path 'plugins' 'k-agents' '.github' 'plugin.json'
          $plugin = Get-Content $pluginPath -Raw | ConvertFrom-Json
          $current = [System.Version]$plugin.version
          $newVersion = "$($current.Major).$($current.Minor).$($current.Build + 1)"

          "current=$($current.ToString(3))" >> $env:GITHUB_OUTPUT
          "new=$newVersion" >> $env:GITHUB_OUTPUT
          "tag=v$newVersion" >> $env:GITHUB_OUTPUT

          Write-Information -InformationAction Continue "Version: $($current.ToString(3)) → $newVersion"

      - name: 📦 Smartagr installieren
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.K_ACTIONS_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $owner = 'GrexyLoco'

          Write-Output "::add-mask::$($env:GH_PACKAGES_TOKEN)"

          # Auth-Header für direkte NuGet V3 API Zugriffe
          $basicAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${owner}:$($env:GH_PACKAGES_TOKEN)"))
          $headers = @{ Authorization = "Basic $basicAuth" }

          # NuGet V3 Service Index abfragen
          $index = Invoke-RestMethod -Uri "https://nuget.pkg.github.com/$owner/index.json" -Headers $headers
          $baseUrl = ($index.resources | Where-Object { $_.'@type' -eq 'PackageBaseAddress/3.0.0' }).'@id'
          Write-Information -InformationAction Continue "✅ NuGet Feed erreichbar, BaseUrl: $baseUrl"

          $modulesPath = Join-Path $HOME '.local/share/powershell/Modules'
          $modules = @(
            'K.PSGallery.PackageRepoProvider.GitHub',
            'K.PSGallery.PackageRepoProvider',
            'K.PSGallery.Smartagr'
          )

          foreach ($mod in $modules) {
            Write-Information -InformationAction Continue "📥 Installiere $mod..."
            $lowerMod = $mod.ToLower()

            # Verfügbare Versionen abfragen
            $versions = (Invoke-RestMethod -Uri "${baseUrl}${lowerMod}/index.json" -Headers $headers).versions
            $latestVersion = $versions[-1]
            Write-Information -InformationAction Continue "   Version: $latestVersion"

            # .nupkg herunterladen
            $nupkgUrl = "${baseUrl}${lowerMod}/${latestVersion}/${lowerMod}.${latestVersion}.nupkg"
            $tempFile = Join-Path $env:RUNNER_TEMP "${mod}.${latestVersion}.nupkg"
            Invoke-WebRequest -Uri $nupkgUrl -Headers $headers -OutFile $tempFile

            # Entpacken ins PowerShell Modules-Verzeichnis
            $destPath = Join-Path $modulesPath $mod $latestVersion
            New-Item -Path $destPath -ItemType Directory -Force | Out-Null
            Expand-Archive $tempFile -DestinationPath $destPath -Force

            Import-Module $mod -Force -Global
            $v = (Get-Module $mod).Version
            Write-Information -InformationAction Continue "✅ $mod v$v"
          }

      - name: 🚀 Smart Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.tag }}'

          $notes = @"
          ## K.Agents $version

          Aktualisierte AI-Agents und Skills für .NET, PowerShell und Azure.

          ### 📋 Update
          ```
          /plugin update k-agents
          ```

          ---
          *Auto-generated by Smartagr*
          "@

          Write-Information -InformationAction Continue "🚀 Erstelle Release $version..."

          $result = New-SmartRelease `
            -TargetVersion $version `
            -ReleaseNotes $notes `
            -PushToRemote `
            -Force

          if ($result.Success) {
            Write-Information -InformationAction Continue "✅ Release erstellt: $($result.ReleaseUrl)"
            Write-Information -InformationAction Continue "🏷️ Tags: $($result.TagsCreated -join ', ')"
          } else {
            Write-Error "❌ Release fehlgeschlagen: $($result.ErrorMessage)"
            exit 1
          }

      - name: 📝 JSON-Dateien aktualisieren
        shell: pwsh
        run: |
          $newVersion = '${{ steps.version.outputs.new }}'

          # plugin.json
          $pluginPath = Join-Path 'plugins' 'k-agents' '.github' 'plugin.json'
          $plugin = Get-Content $pluginPath -Raw | ConvertFrom-Json
          $plugin.version = $newVersion
          $plugin | ConvertTo-Json -Depth 10 | Set-Content $pluginPath -Encoding utf8

          # marketplace.json
          $marketplacePath = Join-Path '.github' 'plugin' 'marketplace.json'
          $marketplace = Get-Content $marketplacePath -Raw | ConvertFrom-Json
          $marketplace.plugins[0].version = $newVersion
          $marketplace | ConvertTo-Json -Depth 10 | Set-Content $marketplacePath -Encoding utf8

          Write-Information -InformationAction Continue "📝 Version in JSON: $newVersion"

      - name: 💾 Version committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/k-agents/.github/plugin.json .github/plugin/marketplace.json
          git diff --staged --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore(plugin): Version auf ${{ steps.version.outputs.new }} aktualisiert [skip ci]"
          git push

      - name: 📊 Summary
        if: always()
        shell: pwsh
        run: |
          $current = '${{ steps.version.outputs.current }}'
          $new = '${{ steps.version.outputs.new }}'
          $tag = '${{ steps.version.outputs.tag }}'

          $summary = @"
          ## 🚀 K.Agents Release

          | Property | Value |
          |----------|-------|
          | **Version** | `````` → `````` |
          | **Tag** | `````` |
          | **Smart Tags** | ```v$($new.Split('.')[0])```, ```v$($new.Split('.')[0]).$($new.Split('.')[1])```, ```latest``` |

          ### 📋 Update für Nutzer
          ```
          /plugin update k-agents
          ```
          "@

          Write-Output $summary >> $env:GITHUB_STEP_SUMMARY