# Für eigene Logik (Deployments, Notifications):
#   → Eigenen Workflow mit repository_dispatch erstellen.
#   → Docs: https://github.com/GrexyLoco/K.Actions.ReleaseFlow/blob/master/USAGE.md#consumer-hooks
# ═══════════════════════════════════════════════════════════════
# Basic ReleaseFlow Workflow
#
# This is the minimal setup for K.Actions.ReleaseFlow.
#
# Architektur: Option A — Getrennte Workflows (#407)
#   alpha-release.yml → PR-close auf dev/v*      → Alpha
#   beta-release.yml  → push auf release/v*      → Beta
#   release.yml       → PR-close auf main/master → Stable
#                        oder dev/v* → release/v* (Freeze)
#
# Diese release.yml lauscht ausschließlich auf main/master und release/v*,
# damit sie NICHT parallel zu alpha-release.yml auf dev/v*-PR-Merges feuert
# (Race-Condition mit doppelten Tag-Erstellungs-Versuchen).

name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
      - 'release/v*'

jobs:
  release:
    # Triggert nur bei:
    #   - Stable-Promo   : head=release/v* → base=main|master
    #   - Freeze-Promo   : head=dev/v*     → base=release/v*
    # Alpha/Beta laufen exklusiv in den phasenspezifischen Workflows.
    if: |
      github.event.pull_request.merged == true && (
        ((github.base_ref == 'main' || github.base_ref == 'master') &&
         startsWith(github.event.pull_request.head.ref, 'release/v'))
        ||
        (startsWith(github.base_ref, 'release/v') &&
         startsWith(github.event.pull_request.head.ref, 'dev/v'))
      )
    runs-on: ubuntu-latest
    
    permissions:
      contents: write      # For tags and releases
      pull-requests: write # For backflow PRs
    
    steps:
      # GitHub App Token ZUERST — damit Checkout ihn als Git-Credential
      # persistiert (#406). Spätere 'git push' in New-FreezeRelease,
      # Smart-Tag-Updates und Tag-Cleanup laufen dann unter App-Identität
      # und greifen in den Ruleset-Bypass.
      - name: 🔑 Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASEFLOW_APP_ID }}
          private-key: ${{ secrets.RELEASEFLOW_APP_PRIVATE_KEY }}
          owner: GrexyLoco
          repositories: >
            ${{ github.event.repository.name }},K.Actions.ReleaseFlow

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0    # Full history for tag operations
          fetch-tags: true  # Ensure tags are fetched
          token: ${{ steps.app-token.outputs.token }}  # App-Token als Git-Credential (#406)

      # Cross-Repo-Checkout (#390): private K.Actions.ReleaseFlow ist fuer
      # Consumer-Runner nicht ueber 'uses: <repo>@ref' aufloesbar.
      - name: Checkout ReleaseFlow Action
        uses: actions/checkout@v6
        with:
          repository: GrexyLoco/K.Actions.ReleaseFlow
          ref: v1
          token: ${{ steps.app-token.outputs.token }}
          path: .releaseflow

      - name: Run ReleaseFlow
        id: release
        uses: ./.releaseflow
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Consumer-Hook auslösen
        if: success() && steps.release.outputs.phase != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type="releaseflow-${{ steps.release.outputs.phase }}" \
            -f "client_payload[version]=${{ steps.release.outputs.version }}" \
            -f "client_payload[tag]=${{ steps.release.outputs.tag }}" \
            -f "client_payload[release-url]=${{ steps.release.outputs.release-url }}" \
            -f "client_payload[phase]=${{ steps.release.outputs.phase }}"
