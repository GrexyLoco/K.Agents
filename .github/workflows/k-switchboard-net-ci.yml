name: K.Switchboard .NET CI

on:
  pull_request:
    branches:
      - 'dev/v*'
      - 'release/v*'
      - main
    paths:
      - 'k.switchboard.net/**'
      - '.github/workflows/k-switchboard-net-ci.yml'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-publish:
    name: Build / Test / Publish (win-x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: NuGet-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('k.switchboard.net/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: dotnet restore
        working-directory: k.switchboard.net
        run: dotnet restore K.Switchboard.slnx

      - name: dotnet build
        working-directory: k.switchboard.net
        run: dotnet build K.Switchboard.slnx -c Release --no-restore

      - name: dotnet format prüfen
        working-directory: k.switchboard.net
        run: dotnet format K.Switchboard.slnx --verify-no-changes

      - name: Tests (TUnit)
        working-directory: k.switchboard.net
        run: dotnet run --project tests/K.Switchboard.Tests -c Release

      - name: Single-File Publish (win-x64)
        working-directory: k.switchboard.net
        run: |
          dotnet publish src/K.Switchboard/K.Switchboard.csproj `
            -c Release `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -r win-x64 `
            --self-contained true `
            -o publish/

      - name: Release-Bundle vorbereiten
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $distRoot = Join-Path 'k.switchboard.net' 'dist'
          $bundleRoot = Join-Path $distRoot 'bundle'

          New-Item -ItemType Directory -Path $bundleRoot -Force | Out-Null

          Copy-Item -Path (Join-Path 'k.switchboard.net/publish' 'K.Switchboard.exe') -Destination (Join-Path $bundleRoot 'K.Switchboard.exe') -Force
          Copy-Item -Path (Join-Path 'k.switchboard.net/scripts' 'install-windows.ps1') -Destination (Join-Path $bundleRoot 'install-windows.ps1') -Force
          Copy-Item -Path (Join-Path 'k.switchboard.net' 'README.md') -Destination (Join-Path $bundleRoot 'K.Switchboard-README.md') -Force

          Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath (Join-Path $distRoot 'K.Switchboard-win-x64.zip') -Force
          Copy-Item -Path (Join-Path $bundleRoot 'K.Switchboard-README.md') -Destination (Join-Path $distRoot 'K.Switchboard-README.md') -Force

          $expected = @('K.Switchboard-README.md', 'K.Switchboard.exe', 'install-windows.ps1')
          $actual = Get-ChildItem -Path $bundleRoot -File | Select-Object -ExpandProperty Name | Sort-Object
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw 'Release-Bundle enthält nicht exakt EXE + Installer + README.'
          }

      - name: Bundle + README als Artefakt hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: K.Switchboard-release-bundle
          path: |
            k.switchboard.net/dist/K.Switchboard-win-x64.zip
            k.switchboard.net/dist/K.Switchboard-README.md
          retention-days: 30

  upload-release-asset:
    name: Bundle + README an GitHub Release anhängen
    needs: build-test-publish
    # Nur fuer Stable-Tags (vX.Y.Z) hochladen — Pre-Release-Tags wie
    # v1.18.1-freeze/-beta/-alpha haben kein GitHub Release und wuerden
    # mit "release not found" fehlschlagen.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Artefakt herunterladen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: K.Switchboard-release-bundle
          path: dist/

      - name: Bundle + README an Release hängen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          gh release upload "$tag" "dist/K.Switchboard-win-x64.zip" "dist/K.Switchboard-README.md" --clobber --repo "$env:GITHUB_REPOSITORY"
