# ═══════════════════════════════════════════════════════════════
# K.Actions.ReleaseFlow — Beta Release Pipeline
# version: v1.12.0
# commit: 84b4015
# updated: 2026-07-27
# content-hash: ED613081
#
# ⚠️  DIESE DATEI WIRD AUTOMATISCH VERWALTET.
# Änderungen werden beim nächsten ReleaseFlow-Update überschrieben.
# Für eigene Logik (Deployments, Notifications):
#   → Eigenen Workflow mit repository_dispatch erstellen.
#   → Docs: https://github.com/GrexyLoco/K.Actions.ReleaseFlow/blob/master/USAGE.md#consumer-hooks
# ═══════════════════════════════════════════════════════════════
name: "RF: Beta Release Pipeline"

# Trigger: PR-Merge auf release/v* Branches (Fix-PR oder Promotion-PR gemerged)
# Erzeugt vX.Y.Z-beta.N Tag + GitHub Pre-release
#
# Architektur: Option A — Getrennte Workflows (empfohlen)
#   alpha-release.yml → PR-close auf dev/v*      → Alpha
#   beta-release.yml  → PR-close auf release/v*  → Beta
#   release.yml       → PR-close auf main/master → Stable
on:
  pull_request:
    types: [closed]
    branches: ['release/v*']
  # Break-Glass (#552): Freeze nachholen, wenn der pull_request:closed-Event
  # des Promotion-Merges verloren ging (z.B. GitHub-Incident). Dispatch auf
  # dem release/v*-Branch selbst; Version wird aus dem Ref abgeleitet:
  #   gh workflow run beta-release.yml --ref release/vX.Y.Z
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: write       # für phase:in-beta label (#287)

jobs:
  beta-release:
    name: Beta Release
    runs-on: ubuntu-latest
    # PR-Pfad: NUR gemergte fix/*-PRs (Beta-Fix). Der reguläre Freeze-Promo-
    # Merge (dev/v* → release/v*) wird exklusiv von basic.yml (= Consumer-
    # release.yml) verarbeitet — ohne den head-ref-Filter würden beide
    # Templates auf denselben Merge-Event reagieren und um denselben Tag
    # konkurrieren (#523).
    # Dispatch-Pfad (unverändert): bleibt weiterhin der Break-Glass-Freeze-
    # Pfad aus #552 — wird genutzt, wenn der pull_request:closed-Event des
    # Freeze-Promo-Merges verloren ging. basic.yml hat keinen workflow_dispatch-
    # Trigger, deshalb lebt die Freeze-Wiederholung hier, getrennt vom
    # regulären Freeze-Promo-Merge-Pfad in basic.yml. Die Action erkennt den
    # Freeze-Kontext selbst aus dem release/v*-Ref (Get-ReleaseContext).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'fix/'))
    # Concurrency backstop (#523): serializes runs per target branch in addition
    # to the API-based tag reservation (New-PreReleaseTag / New-FreezeRelease).
    # GitHub keeps at most ONE pending run queued per group — if a third rapid
    # merge arrives while one run is active and another already queued, the
    # queued middle run is displaced by the newest one. That is acceptable here
    # because tags are cumulative: the newest run still picks up all merged
    # changes. cancel-in-progress MUST stay false — cancelling an in-flight run
    # would destroy that release.
    # Job-level (not workflow-level): a run skipped by this job's `if:` (e.g.
    # a PR close that is neither the promo-merge nor a fix/* merge) never
    # enters the group, so it cannot displace a queued genuine release run
    # and cause silent alpha/beta loss.
    concurrency:
      group: releaseflow-prerelease-${{ github.event.pull_request.base.ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      # GitHub App Token ZUERST (#406) — siehe Kommentar in basic.yml
      - name: 🔑 GitHub App Token generieren
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASEFLOW_APP_ID }}
          private-key: ${{ secrets.RELEASEFLOW_APP_PRIVATE_KEY }}
          owner: GrexyLoco
          repositories: >
            ${{ github.event.repository.name }},K.Actions.ReleaseFlow

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      # Cross-Repo-Checkout (#390): private K.Actions.ReleaseFlow ist fuer
      # Consumer-Runner nicht ueber 'uses: <repo>@ref' aufloesbar.
      - name: Checkout ReleaseFlow Action
        uses: actions/checkout@v6
        with:
          repository: GrexyLoco/K.Actions.ReleaseFlow
          ref: v1
          token: ${{ steps.app-token.outputs.token }}
          path: .releaseflow

      - name: ReleaseFlow ausführen (Beta)
        id: release
        uses: ./.releaseflow
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          action: release

      - name: Summary
        if: always()
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          URL="${{ steps.release.outputs.release-url }}"
          CREATED="${{ steps.release.outputs.release-created }}"

          if [ "$CREATED" = "true" ]; then
            echo "## 🧪 Beta Release: $TAG" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ [Release $TAG]($URL) erfolgreich erstellt." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🧪 Beta Release" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ Kein neues Release erstellt." >> $GITHUB_STEP_SUMMARY
          fi

      # Label integrierte Issues mit phase:in-beta (#287)
      # Parst Closing-Keywords aus dem PR-Body und labelt referenzierte Issues.
      - name: Label integrated issues with phase:in-beta
        if: steps.release.outcome == 'success' && startsWith(github.event.pull_request.head.ref, 'fix/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          ISSUE_NUMBERS=$(printf '%s' "$PR_BODY" | grep -oiE '(closes?|closed|fix(es|ed)?|resolves?|resolved|refs?)[ :]*#[0-9]+' | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No closing keywords found — no issues to label."
            exit 0
          fi

          REPO="${{ github.repository }}"
          for ISSUE in $ISSUE_NUMBERS; do
            gh issue edit "$ISSUE" --repo "$REPO" --add-label 'phase:in-beta' 2>&1 || \
              echo "::warning::Could not label issue #$ISSUE (continuing)"
          done

      - name: Consumer-Hook auslösen
        if: success() && steps.release.outputs.release-created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type="releaseflow-beta" \
            -f "client_payload[version]=${{ steps.release.outputs.version }}" \
            -f "client_payload[tag]=${{ steps.release.outputs.tag }}" \
            -f "client_payload[release-url]=${{ steps.release.outputs.release-url }}" \
            -f "client_payload[phase]=beta"
