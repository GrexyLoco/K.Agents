# ═══════════════════════════════════════════════════════════════
# K.Actions.ReleaseFlow — Beta Release Pipeline
# version: v1.9.17
# commit: 0f0f46a
# updated: 2026-05-01
# content-hash: 00000000
#
# ⚠️  DIESE DATEI WIRD AUTOMATISCH VERWALTET.
# Änderungen werden beim nächsten ReleaseFlow-Update überschrieben.
# Für eigene Logik (Deployments, Notifications):
#   → Eigenen Workflow mit repository_dispatch erstellen.
#   → Docs: https://github.com/GrexyLoco/K.Actions.ReleaseFlow/blob/master/USAGE.md#consumer-hooks
# ═══════════════════════════════════════════════════════════════
name: "RF: Beta Release Pipeline"

# Trigger: PR-Merge auf release/v* Branches (Fix-PR oder Promotion-PR gemerged)
# Erzeugt vX.Y.Z-beta.N Tag + GitHub Pre-release
#
# Architektur: Option A — Getrennte Workflows (empfohlen)
#   alpha-release.yml → PR-close auf dev/v*      → Alpha
#   beta-release.yml  → PR-close auf release/v*  → Beta
#   release.yml       → PR-close auf main/master → Stable
#
# Wichtig: pull_request:closed (nicht push!) damit GITHUB_EVENT_PATH
# das pull_request-Objekt enthält, das Get-ReleaseContext benötigt.
# Siehe Issue #119.
on:
  pull_request:
    types: [closed]
    branches: ['release/v*']

# Keine concurrency-group — Race-Schutz ist in #320 strukturell in der
# Action selbst.

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: write       # für phase:in-beta label (#287)

jobs:
  beta-release:
    name: Beta Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      # GitHub App Token ZUERST (#406) — siehe Kommentar in basic.yml
      - name: 🔑 GitHub App Token generieren
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASEFLOW_APP_ID }}
          private-key: ${{ secrets.RELEASEFLOW_APP_PRIVATE_KEY }}
          owner: GrexyLoco
          repositories: >
            ${{ github.event.repository.name }},K.Actions.ReleaseFlow

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      # Cross-Repo-Checkout (#390): private K.Actions.ReleaseFlow ist fuer
      # Consumer-Runner nicht ueber 'uses: <repo>@ref' aufloesbar.
      - name: Checkout ReleaseFlow Action
        uses: actions/checkout@v6
        with:
          repository: GrexyLoco/K.Actions.ReleaseFlow
          ref: v1
          token: ${{ steps.app-token.outputs.token }}
          path: .releaseflow

      - name: ReleaseFlow ausführen (Beta)
        id: release
        uses: ./.releaseflow
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          action: release

      - name: Summary
        if: always()
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          URL="${{ steps.release.outputs.release-url }}"
          CREATED="${{ steps.release.outputs.release-created }}"

          if [ "$CREATED" = "true" ]; then
            echo "## 🧪 Beta Release: $TAG" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ [Release $TAG]($URL) erfolgreich erstellt." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🧪 Beta Release" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ Kein neues Release erstellt." >> $GITHUB_STEP_SUMMARY
          fi

      # Label integrierte Issues mit phase:in-beta (#287)
      # Parst Closing-Keywords aus dem PR-Body und labelt referenzierte Issues.
      - name: Label integrated issues with phase:in-beta
        if: steps.release.outcome == 'success' && startsWith(github.event.pull_request.head.ref, 'fix/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          ISSUE_NUMBERS=$(printf '%s' "$PR_BODY" | grep -oiE '(closes?|closed|fix(es|ed)?|resolves?|resolved|refs?)[ :]*#[0-9]+' | grep -oE '#[0-9]+' | tr -d '#' | sort -u)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No closing keywords found — no issues to label."
            exit 0
          fi

          REPO="${{ github.repository }}"
          for ISSUE in $ISSUE_NUMBERS; do
            gh issue edit "$ISSUE" --repo "$REPO" --add-label 'phase:in-beta' 2>&1 || \
              echo "::warning::Could not label issue #$ISSUE (continuing)"
          done

      - name: Consumer-Hook auslösen
        if: success() && steps.release.outputs.release-created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type="releaseflow-beta" \
            -f "client_payload[version]=${{ steps.release.outputs.version }}" \
            -f "client_payload[tag]=${{ steps.release.outputs.tag }}" \
            -f "client_payload[release-url]=${{ steps.release.outputs.release-url }}" \
            -f "client_payload[phase]=beta"
