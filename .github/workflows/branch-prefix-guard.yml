name: "RF: Branch-Prefix Guard"

# Verhindert PRs mit falschen Branch-Prefixen auf dev/v* und release/v*.
# Erlaubt: feature/*, fix/*, dev/v* (Promotion), release/v* (Stable).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'dev/v*'
      - 'release/v*'
      - 'master'
      - 'main'

permissions:
  pull-requests: read

jobs:
  branch-prefix-guard:
    name: Branch-Prefix prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Branch-Prefix validieren
        id: validate
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Head: $HEAD_REF → Base: $BASE_REF"

          # Erlaubte Prefixe für Code-PRs
          if [[ "$HEAD_REF" =~ ^feature/ ]] || [[ "$HEAD_REF" =~ ^fix/ ]]; then
            echo "✅ Branch-Prefix '$HEAD_REF' ist erlaubt."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Promotion-PRs: dev/v* → release/v* (Freeze)
          if [[ "$HEAD_REF" =~ ^dev/v ]] && [[ "$BASE_REF" =~ ^release/v ]]; then
            echo "✅ Promotion-PR erkannt (dev → release). Erlaubt."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Stable-PRs: release/v* → master/main
          if [[ "$HEAD_REF" =~ ^release/v ]] && [[ "$BASE_REF" =~ ^(master|main)$ ]]; then
            echo "✅ Stable-PR erkannt (release → master). Erlaubt."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Backflow-PRs: master/main → dev/v* oder release/v*
          if [[ "$HEAD_REF" =~ ^(master|main)$ ]]; then
            echo "✅ Backflow-PR erkannt (master → dev/release). Erlaubt."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Alles andere ist verboten
          echo "::error::❌ Branch-Prefix '$HEAD_REF' ist nicht erlaubt!"
          echo ""
          echo "Erlaubte Prefixe für Code-PRs:"
          echo "  • feature/*  (z.B. feature/329-branch-prefix-guard)"
          echo "  • fix/*      (z.B. fix/330-label-agnostic)"
          echo ""
          echo "Der PR-Titel-Typ (FEAT:, FIX:, DOC:, REFACTOR:) ist unabhängig vom Branch-Prefix."

          echo "allowed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            TITLE="## ✅ Branch-Prefix Guard"
            RESULT="✅ Erlaubt"
            DETAIL="Branch-Prefix ist erlaubt."
          else
            TITLE="## ❌ Branch-Prefix Guard — Fehlgeschlagen"
            RESULT="❌ Verboten"
            DETAIL="Branch-Prefix ist **nicht erlaubt**."
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          $TITLE

          > 🛡️ PR #${{ github.event.pull_request.number }} — Branch `${{ github.head_ref }}` wurde gegen `${{ github.base_ref }}` geprüft.
          > $DETAIL
          >
          > 📖 [Zur Dokumentation](https://github.com/GrexyLoco/K.Actions.ReleaseFlow/blob/master/USAGE.md#branch-prefix-guard)

          | Feld | Wert |
          |------|------|
          | **Head** | `${{ github.head_ref }}` |
          | **Base** | `${{ github.base_ref }}` |
          | **Ergebnis** | $RESULT |
          EOF
