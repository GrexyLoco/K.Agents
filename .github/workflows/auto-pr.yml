# ═══════════════════════════════════════════════════════════════
# K.Actions.ReleaseFlow — Auto-PR Pipeline
# version: untagged@9fefd0a
# commit: 9fefd0a
# updated: 2026-04-19
# content-hash: D26CA4AB
#
# ⚠️  DIESE DATEI WIRD AUTOMATISCH VERWALTET.
# Änderungen werden beim nächsten ReleaseFlow-Update überschrieben.
# Für eigene Logik (Deployments, Notifications):
#   → Eigenen Workflow mit repository_dispatch erstellen.
#   → Docs: https://github.com/GrexyLoco/K.Actions.ReleaseFlow/blob/master/USAGE.md#consumer-hooks
# ═══════════════════════════════════════════════════════════════
name: Auto-PR

# Trigger: Push auf fix/* oder feature/* Branches.
# Legt automatisch einen PR gegen den aktiven Train-Branch an.
# KEIN workflow_dispatch — nicht manuell auslösbar.
#
# Voraussetzungen:
#   vars.RELEASEFLOW_APP_ID            — GitHub App ID
#   secrets.RELEASEFLOW_APP_PRIVATE_KEY — GitHub App Private Key (PEM)
on:
  push:
    branches:
      - 'fix/**'
      - 'feature/**'

jobs:
  auto-pr:
    name: Auto-PR erstellen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: GitHub App Token generieren
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASEFLOW_APP_ID }}
          private-key: ${{ secrets.RELEASEFLOW_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Branch-Name analysieren
        id: branch
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"

          # Branch-Typ
          if [[ "$REF_NAME" =~ ^fix/ ]]; then
            echo "type=fix" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" =~ ^feature/ ]]; then
            echo "type=feature" >> "$GITHUB_OUTPUT"
          else
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

          # Issue-Nummer: fix/42-slug oder feature/42-slug
          if [[ "$REF_NAME" =~ ^(fix|feature)/([0-9]+)- ]]; then
            echo "issue=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "has_issue=true"           >> "$GITHUB_OUTPUT"
          else
            echo "issue="          >> "$GITHUB_OUTPUT"
            echo "has_issue=false" >> "$GITHUB_OUTPUT"
          fi

      # Smart Milestone-Binding: auto-assign issue to active train (#200)
      - name: Issue-Milestone auflösen / zuordnen
        id: milestone-binding
        if: steps.branch.outputs.has_issue == 'true'
        uses: GrexyLoco/K.Actions.ReleaseFlow@v1
        with:
          action:       resolve-milestone
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ steps.branch.outputs.issue }}
          branch-name:  ${{ steps.branch.outputs.branch }}

      - name: Aktiven Release-Train ermitteln
        id: train
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_TYPE: ${{ steps.branch.outputs.type }}
        shell: bash
        run: |
          REPO="${{ github.repository }}"

          # Draft Release Intent lesen (kanonische Quelle)
          INTENT=$(gh api "repos/$REPO/releases" \
            --jq '[.[] | select(.draft == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.created_at) | last' \
            2>/dev/null || true)

          if [ -z "$INTENT" ] || [ "$INTENT" = "null" ]; then
            echo "::error::Kein aktiver Draft Release Intent gefunden."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          TAG=$(echo "$INTENT" | jq -r '.tag_name')
          VERSION="${TAG#v}"
          DEV_BRANCH="dev/v$VERSION"
          REL_BRANCH="release/v$VERSION"

          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "dev_branch=$DEV_BRANCH" >> "$GITHUB_OUTPUT"
          echo "rel_branch=$REL_BRANCH" >> "$GITHUB_OUTPUT"
          echo "found=true"             >> "$GITHUB_OUTPUT"

          # Beta-Erkennung
          BETA_TAGS=$(git tag -l "${TAG}-beta.*" 2>/dev/null)
          REL_EXISTS=$(gh api "repos/$REPO/branches/$REL_BRANCH" --jq '.name' 2>/dev/null || true)

          if [ -n "$BETA_TAGS" ] || [ -n "$REL_EXISTS" ]; then
            echo "phase=beta" >> "$GITHUB_OUTPUT"
          else
            echo "phase=alpha" >> "$GITHUB_OUTPUT"
          fi

      - name: Ziel-Branch bestimmen
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_TYPE: ${{ steps.branch.outputs.type }}
          PHASE: ${{ steps.train.outputs.phase }}
          DEV_BRANCH: ${{ steps.train.outputs.dev_branch }}
          REL_BRANCH: ${{ steps.train.outputs.rel_branch }}
        shell: bash
        run: |
          if [ "$BRANCH_TYPE" = "feature" ]; then
            echo "base=$DEV_BRANCH" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH_TYPE" = "fix" ] && [ "$PHASE" = "beta" ]; then
            REL_EXISTS=$(gh api "repos/${{ github.repository }}/branches/$REL_BRANCH" --jq '.name' 2>/dev/null || true)
            if [ -n "$REL_EXISTS" ]; then
              echo "base=$REL_BRANCH" >> "$GITHUB_OUTPUT"
            else
              echo "base=$DEV_BRANCH" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "base=$DEV_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: PR erstellen (idempotent)
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: ${{ steps.target.outputs.base }}
          ISSUE_NR: ${{ steps.branch.outputs.issue }}
          HAS_ISSUE: ${{ steps.branch.outputs.has_issue }}
          BRANCH_TYPE: ${{ steps.branch.outputs.type }}
        shell: bash
        run: |
          REPO="${{ github.repository }}"

          # Duplikat-Check
          EXISTING_PR=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
            --json url --jq '.[0].url // empty' 2>/dev/null || true)

          if [ -n "$EXISTING_PR" ]; then
            echo "pr_url=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "pr_created=false"    >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR-Body
          if [ "$HAS_ISSUE" = "true" ]; then
            PR_BODY="Closes #$ISSUE_NR"
          else
            PR_BODY="*Kein Issue im Branch-Namen — bitte manuell verknuepfen.*"
          fi

          # PR-Titel: TYPE: IssueTitle (#IssueId) — Konvention #250
          SLUG="${HEAD_BRANCH#*/}"

          # SolutionType Mapping: fix→FIX, feature→FEAT
          TYPE_UPPER=$(echo "$BRANCH_TYPE" | tr '[:lower:]' '[:upper:]')
          if [ "$TYPE_UPPER" = "FEATURE" ]; then TYPE_UPPER="FEAT"; fi

          if [ "$HAS_ISSUE" = "true" ]; then
            ISSUE_TITLE=$(gh issue view "$ISSUE_NR" --repo "$REPO" --json title --jq '.title' 2>/dev/null || echo "$SLUG")
            if [ ${#ISSUE_TITLE} -gt 60 ]; then
              ISSUE_TITLE="${ISSUE_TITLE:0:57}..."
            fi
            # Duplicate-Prefix-Schutz (#377): wenn Issue-Titel bereits einen
            # Konventions-Prefix (FIX/FEAT/DOC/REFACTOR:) traegt, Prefix nicht
            # erneut voranstellen — sonst entsteht "FIX: FIX: ...".
            if [[ "$ISSUE_TITLE" =~ ^(FIX|FEAT|DOC|REFACTOR):[[:space:]] ]]; then
              PR_TITLE="$ISSUE_TITLE (#$ISSUE_NR)"
            else
              PR_TITLE="$TYPE_UPPER: $ISSUE_TITLE (#$ISSUE_NR)"
            fi
          else
            PR_TITLE="$TYPE_UPPER: $SLUG"
          fi

          PR_URL=$(gh pr create --repo "$REPO" \
            --head "$HEAD_BRANCH" --base "$BASE_BRANCH" \
            --title "$PR_TITLE" --body "$PR_BODY")

          echo "pr_url=$PR_URL"  >> "$GITHUB_OUTPUT"
          echo "pr_created=true" >> "$GITHUB_OUTPUT"

      - name: Consumer-Hook auslösen
        if: success() && steps.pr.outputs.pr_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type="releaseflow-auto-pr" \
            -f "client_payload[pr-url]=${{ steps.pr.outputs.pr_url }}" \
            -f "client_payload[branch]=${{ steps.branch.outputs.branch }}" \
            -f "client_payload[phase]=auto-pr"
