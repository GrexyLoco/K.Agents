# ═══════════════════════════════════════════════════════════════
# K.Actions.ReleaseFlow — Auto-PR Pipeline
# version: v1.18.0
# commit: d22c650
# updated: 2026-08-16
# content-hash: A245988F
#
# ⚠️  DIESE DATEI WIRD AUTOMATISCH VERWALTET.
# Änderungen werden beim nächsten ReleaseFlow-Update überschrieben.
# Für eigene Logik (Deployments, Notifications):
#   → Eigenen Workflow mit repository_dispatch erstellen.
#   → Docs: https://github.com/GrexyLoco/K.Actions.ReleaseFlow/blob/master/USAGE.md#consumer-hooks
# ═══════════════════════════════════════════════════════════════
name: "RF: 🔧 Auto-PR"

# Trigger:
#   - Push auf fix/* oder feature/* Branches (primär)
#   - workflow_dispatch als Retry-Workaround (#408)
#
# Hintergrund zu workflow_dispatch (#408): In K.Agents Train 1.12 wurde
# beobachtet, dass der push-Trigger beim *ersten* Push eines Branches
# sporadisch silent ausfällt (~28%, vermutlich Webhook-Propagation-Race).
# workflow_dispatch erlaubt Consumer/Maintainer das manuelle Nachtriggern
# per 'gh workflow run auto-pr.yml --ref <branch>' ohne weiteren Push.
#
# Zweite belegte Ausfallursache (#652): Runner-Knappheit. Das Concurrency-
# Limit gilt ACCOUNT-weit über alle Repos; am Limit bleibt der Run in der
# Warteschlange und wird nach ~15 Minuten ohne Ausführung abgebrochen
# (gemessen 2026-08-06 in K.Buddy: 6 Auto-PR-Läufe, Peak 20 parallele
# Jobs). Erkennungsmerkmal am Job: leerer runner_name UND leere steps —
# das unterscheidet Runner-Knappheit von einem verlorenen Push-Event.
# WICHTIG: In diesem Fall hilft der Dispatch-Retry NICHT — ein Dispatch
# landet bei ausgelasteter Kapazität genauso in der Warteschlange (4 der
# 6 gemessenen Ausfälle WAREN Dispatches). Abhilfe: warten, bis die
# parallele Last abgeflossen ist, dann erneut dispatchen.
#
# Voraussetzungen:
#   vars.RELEASEFLOW_APP_ID            — GitHub App ID
#   secrets.RELEASEFLOW_APP_PRIVATE_KEY — GitHub App Private Key (PEM)
on:
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
  workflow_dispatch:

jobs:
  auto-pr:
    name: 🤖 Auto-PR erstellen
    runs-on: ubuntu-latest
    # Obergrenze gegen hängende Runs (#656): längster regulärer Lauf < 5 Min
    # gemessen — ohne Limit gilt GitHubs Default von 360 Minuten.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: GitHub App Token generieren
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASEFLOW_APP_ID }}
          private-key: ${{ secrets.RELEASEFLOW_APP_PRIVATE_KEY }}
          owner: GrexyLoco
          repositories: >
            ${{ github.event.repository.name }},K.Actions.ReleaseFlow

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true  # (#410) Tag-basierte Beta-Detection braucht lokale Tags

      # Cross-Repo-Checkout (#390): private K.Actions.ReleaseFlow ist fuer
      # Consumer-Runner nicht ueber 'uses: <repo>@ref' aufloesbar.
      - name: Checkout ReleaseFlow Action
        uses: actions/checkout@v6
        with:
          repository: GrexyLoco/K.Actions.ReleaseFlow
          ref: v1
          token: ${{ steps.app-token.outputs.token }}
          path: .releaseflow
          fetch-tags: true

      - name: Branch-Name analysieren
        id: branch
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"

          # Branch-Typ
          if [[ "$REF_NAME" =~ ^fix/ ]]; then
            echo "type=fix" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" =~ ^feature/ ]]; then
            echo "type=feature" >> "$GITHUB_OUTPUT"
          else
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

          # Issue-Nummer: fix/42-slug oder feature/42-slug
          if [[ "$REF_NAME" =~ ^(fix|feature)/([0-9]+)- ]]; then
            echo "issue=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "has_issue=true"           >> "$GITHUB_OUTPUT"
          else
            echo "issue="          >> "$GITHUB_OUTPUT"
            echo "has_issue=false" >> "$GITHUB_OUTPUT"
          fi

      # Smart Milestone-Binding: auto-assign issue to active train (#200)
      - name: Issue-Milestone auflösen / zuordnen
        id: milestone-binding
        if: steps.branch.outputs.has_issue == 'true'
        uses: ./.releaseflow
        with:
          action:       resolve-milestone
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ steps.branch.outputs.issue }}
          branch-name:  ${{ steps.branch.outputs.branch }}

      - name: Aktiven Release-Train ermitteln
        id: train
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_TYPE: ${{ steps.branch.outputs.type }}
        shell: bash
        run: |
          REPO="${{ github.repository }}"

          # Draft Release Intent lesen (kanonische Quelle)
          INTENT=$(gh api "repos/$REPO/releases" \
            --jq '[.[] | select(.draft == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.created_at) | last' \
            2>/dev/null || true)

          if [ -z "$INTENT" ] || [ "$INTENT" = "null" ]; then
            echo "::error::Kein aktiver Draft Release Intent gefunden."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          TAG=$(echo "$INTENT" | jq -r '.tag_name')
          VERSION="${TAG#v}"
          DEV_BRANCH="dev/v$VERSION"
          REL_BRANCH="release/v$VERSION"

          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "dev_branch=$DEV_BRANCH" >> "$GITHUB_OUTPUT"
          echo "rel_branch=$REL_BRANCH" >> "$GITHUB_OUTPUT"
          echo "found=true"             >> "$GITHUB_OUTPUT"

          # Beta-Erkennung (#410): Tag-basiert, nicht Branch-basiert.
          # Branch release/vX.Y.Z kann durch Legacy-Setup oder manuellen Anlage
          # existieren, OHNE dass jemals ein Freeze-Dispatch lief — dann wäre
          # eine Branch-basierte Phase-Detection ein false positive (Beta ohne
          # echten Freeze). Der Freeze-Tag vX.Y.Z-freeze wird dagegen nur durch
          # erfolgreichen Freeze-Dispatch gesetzt — Tag-Präsenz ist das echte
          # Beta-Signal.
          FREEZE_TAG=$(git tag -l "${TAG}-freeze" 2>/dev/null)
          BETA_TAGS=$(git tag -l "${TAG}-beta.*" 2>/dev/null)

          if [ -n "$FREEZE_TAG" ] || [ -n "$BETA_TAGS" ]; then
            echo "phase=beta" >> "$GITHUB_OUTPUT"
          else
            echo "phase=alpha" >> "$GITHUB_OUTPUT"
          fi

      - name: Ziel-Branch bestimmen
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_TYPE: ${{ steps.branch.outputs.type }}
          PHASE: ${{ steps.train.outputs.phase }}
          DEV_BRANCH: ${{ steps.train.outputs.dev_branch }}
          REL_BRANCH: ${{ steps.train.outputs.rel_branch }}
        shell: bash
        run: |
          if [ "$BRANCH_TYPE" = "feature" ]; then
            echo "base=$DEV_BRANCH" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH_TYPE" = "fix" ] && [ "$PHASE" = "beta" ]; then
            REL_EXISTS=$(gh api "repos/${{ github.repository }}/branches/$REL_BRANCH" --jq '.name' 2>/dev/null || true)
            if [ -n "$REL_EXISTS" ]; then
              echo "base=$REL_BRANCH" >> "$GITHUB_OUTPUT"
            else
              echo "base=$DEV_BRANCH" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "base=$DEV_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: PR erstellen (idempotent)
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: ${{ steps.target.outputs.base }}
          ISSUE_NR: ${{ steps.branch.outputs.issue }}
          HAS_ISSUE: ${{ steps.branch.outputs.has_issue }}
          BRANCH_TYPE: ${{ steps.branch.outputs.type }}
        shell: bash
        run: |
          REPO="${{ github.repository }}"

          # Duplikat-Check
          EXISTING_PR=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
            --json url --jq '.[0].url // empty' 2>/dev/null || true)

          if [ -n "$EXISTING_PR" ]; then
            echo "pr_url=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "pr_created=false"    >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR-Body
          if [ "$HAS_ISSUE" = "true" ]; then
            PR_BODY="Closes #$ISSUE_NR"
          else
            PR_BODY="*Kein Issue im Branch-Namen — bitte manuell verknuepfen.*"
          fi

          # PR-Titel: <type>: IssueTitle (#IssueId) — Conventional Commits (#250, #529)
          # Lowercase-Typen (feat/fix/docs/...), damit amannn/action-semantic-pull-request
          # in Consumer-Repos gruen ist.
          SLUG="${HEAD_BRANCH#*/}"

          # Conventional-Commit-Typen (amannn Standard-Liste)
          CONVENTIONAL_TYPES="feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"

          # Branch-Typ → Default conventional type (lowercase)
          case "$BRANCH_TYPE" in
            feature) DEFAULT_TYPE="feat" ;;
            fix)     DEFAULT_TYPE="fix" ;;
            *)       DEFAULT_TYPE="chore" ;;
          esac

          if [ "$HAS_ISSUE" = "true" ]; then
            ISSUE_TITLE=$(gh issue view "$ISSUE_NR" --repo "$REPO" --json title --jq '.title' 2>/dev/null || echo "$SLUG")
            # Duplicate-prefix guard (#377) + lowercase normalization (#529) +
            # truncation-order fix (#560): prefix detection runs FIRST against the
            # FULL (untruncated) issue title — otherwise a 60-char truncation could
            # cut a scope parenthesis mid-way and break the regex (-> doubled
            # prefix, e.g. 'fix: feat(a-long-scope...'). Only the description
            # remainder (REST) is truncated afterwards; type+scope+bang always
            # stay fully intact. A colon without a trailing space ('feat:Title')
            # is accepted; assembly always inserts exactly one space.
            # If the issue title already carries a (optionally scoped/breaking)
            # Conventional-Commit prefix, its type is lowercase-normalized and the
            # remainder is kept — no doubled prefix ('feat: docs: ...'). A 'docs:'
            # issue on feature/* stays 'docs:', a legacy 'FIX:' becomes 'fix:'.
            # Otherwise the branch type is prepended as the lowercase default type.
            if [[ "$ISSUE_TITLE" =~ ^([A-Za-z]+)(\([^\)]*\))?(!)?:[[:space:]]*(.*)$ ]]; then
              ETYPE=$(echo "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              if echo "$ETYPE" | grep -qiE "^($CONVENTIONAL_TYPES)$"; then
                SCOPE="${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
                REST="${BASH_REMATCH[4]}"
                PREFIX="${ETYPE}${SCOPE}: "
                # REST budget = 60 minus the assembled prefix length, floored at
                # 10 chars. In normal cases (short/moderate scope) the assembled
                # title (prefix+REST) stays <=60 chars before the '(#N)' suffix,
                # same as before the fix. Only a pathological long scope hits the
                # 10-char floor and may push the total over 60 — an accepted
                # trade-off, since never cutting mid-scope is the actual #560 fix.
                REST_BUDGET=$((60 - ${#PREFIX}))
                MIN_REST_BUDGET=10
                if [ "$REST_BUDGET" -lt "$MIN_REST_BUDGET" ]; then
                  REST_BUDGET=$MIN_REST_BUDGET
                fi
                if [ ${#REST} -gt "$REST_BUDGET" ]; then
                  REST="${REST:0:$((REST_BUDGET - 3))}..."
                fi
                PR_TITLE="${PREFIX}${REST} (#$ISSUE_NR)"
              else
                if [ ${#ISSUE_TITLE} -gt 60 ]; then
                  ISSUE_TITLE="${ISSUE_TITLE:0:57}..."
                fi
                PR_TITLE="$DEFAULT_TYPE: $ISSUE_TITLE (#$ISSUE_NR)"
              fi
            else
              if [ ${#ISSUE_TITLE} -gt 60 ]; then
                ISSUE_TITLE="${ISSUE_TITLE:0:57}..."
              fi
              PR_TITLE="$DEFAULT_TYPE: $ISSUE_TITLE (#$ISSUE_NR)"
            fi
          else
            PR_TITLE="$DEFAULT_TYPE: $SLUG"
          fi

          PR_URL=$(gh pr create --repo "$REPO" \
            --head "$HEAD_BRANCH" --base "$BASE_BRANCH" \
            --title "$PR_TITLE" --body "$PR_BODY")

          echo "pr_url=$PR_URL"  >> "$GITHUB_OUTPUT"
          echo "pr_created=true" >> "$GITHUB_OUTPUT"

      - name: Consumer-Hook auslösen
        if: success() && steps.pr.outputs.pr_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type="releaseflow-auto-pr" \
            -f "client_payload[pr-url]=${{ steps.pr.outputs.pr_url }}" \
            -f "client_payload[branch]=${{ steps.branch.outputs.branch }}" \
            -f "client_payload[phase]=auto-pr"

      # #513: Consumer Repos erhalten frühzeitig (bei PR-Erstellung) die Chance,
      # einen Manifest-Bump-Commit auf den PR-Branch zu pushen, bevor der PR
      # gemergt wird. So ist der Bump im Merge-Commit enthalten — Tag und
      # Manifest landen auf dem gleichen Commit-Subgraph.
      - name: Prepare-Promotion Event auslösen
        if: success() && steps.pr.outputs.pr_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.train.outputs.tag || format('v{0}', steps.train.outputs.version) }}
          BRANCH_TYPE: ${{ steps.branch.outputs.type }}
          PHASE: ${{ steps.train.outputs.phase }}
          HEAD_BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: ${{ steps.target.outputs.base }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        shell: bash
        run: |
          # Phase-Bestimmung: feature/* immer alpha, fix/* folgt der Train-Phase
          if [ "$BRANCH_TYPE" = "feature" ]; then
            EVENT_PHASE="alpha"
          elif [ "$BRANCH_TYPE" = "fix" ] && [ "$PHASE" = "beta" ]; then
            EVENT_PHASE="beta"
          else
            EVENT_PHASE="alpha"
          fi

          # PR-Nummer aus der URL extrahieren (z.B. .../pull/123)
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$' || true)
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::warning::PR_NUMBER nicht ermittelbar ('$PR_URL') — Prepare-Promotion Event übersprungen."
            exit 0
          fi

          # v-Prefix aus Version entfernen für Payload-Feld 'version'
          VERSION_NO_V="${VERSION#v}"
          # Payload injection-sicher via jq aufbauen
          PAYLOAD=$(jq -n \
            --arg version    "$VERSION_NO_V" \
            --arg tag        "$VERSION" \
            --arg phase      "$EVENT_PHASE" \
            --arg pr_num     "$PR_NUMBER" \
            --arg pr_branch  "$HEAD_BRANCH" \
            --arg tgt_branch "$BASE_BRANCH" \
            '{version: $version, tag: $tag, phase: $phase, pr_number: ($pr_num | tonumber), pr_branch: $pr_branch, target_branch: $tgt_branch}')

          if gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f "event_type=releaseflow-prepare-promotion" \
            -f "client_payload=$PAYLOAD" 2>/dev/null; then
            echo "::notice::releaseflow-prepare-promotion gefeuert (Phase: $EVENT_PHASE, PR: #$PR_NUMBER)"
          else
            echo "::warning::releaseflow-prepare-promotion konnte nicht gefeuert werden — kein Fehler, Release-Flow läuft weiter."
          fi

      - name: Summary
        if: always()
        env:
          HEAD_BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: ${{ steps.target.outputs.base }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          PR_CREATED: ${{ steps.pr.outputs.pr_created }}
          ISSUE_NR: ${{ steps.branch.outputs.issue }}
          HAS_ISSUE: ${{ steps.branch.outputs.has_issue }}
          TRAIN_FOUND: ${{ steps.train.outputs.found }}
          PHASE: ${{ steps.train.outputs.phase }}
          VERSION: ${{ steps.train.outputs.version }}
        shell: bash
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"

          echo "## 🤖 Auto-PR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Branch `$HEAD_BRANCH` wurde gepusht — PR wird automatisch auf den aktiven Release-Train erstellt." >> $GITHUB_STEP_SUMMARY
          echo ">" >> $GITHUB_STEP_SUMMARY
          echo "> 📖 [Zur Dokumentation](https://github.com/GrexyLoco/K.Actions.ReleaseFlow/blob/master/USAGE.md#auto-pr-auto-pryml)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Feld | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Source** | [\`$HEAD_BRANCH\`]($REPO_URL/tree/$HEAD_BRANCH) |" >> $GITHUB_STEP_SUMMARY

          if [ -n "$BASE_BRANCH" ]; then
            echo "| **Target** | [\`$BASE_BRANCH\`]($REPO_URL/tree/$BASE_BRANCH) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Target** | — |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$TRAIN_FOUND" = "true" ]; then
            echo "| **Train** | v$VERSION ($PHASE) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Train** | ❌ Kein aktiver Train gefunden |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$HAS_ISSUE" = "true" ]; then
            echo "| **Issue** | [#$ISSUE_NR]($REPO_URL/issues/$ISSUE_NR) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Issue** | ⚠️ Keine Issue-Nummer im Branch-Namen |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$PR_URL" ]; then
            if [ "$PR_CREATED" = "true" ]; then
              echo "| **PR** | [PR öffnen]($PR_URL) *(neu erstellt)* |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| **PR** | [PR öffnen]($PR_URL) *(existiert bereits)* |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| **PR** | — |" >> $GITHUB_STEP_SUMMARY
          fi
